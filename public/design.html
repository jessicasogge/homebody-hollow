<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homebody Hollow | Design Your Cottage</title>
    <meta name="description" content="Design your tiny cottage in Homebody Hollow: pick a color and a pattern, paint any part of it, then move it into your village." />
    <link rel="canonical" href="https://jessicasogge.github.io/homebody-hollow/design.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homebody Hollow" />
    <meta property="og:title" content="Homebody Hollow | Design Your Cottage" />
    <meta property="og:description" content="Design your tiny cottage in Homebody Hollow: pick a color and a pattern, paint any part of it, then move it into your village." />
    <meta property="og:url" content="https://jessicasogge.github.io/homebody-hollow/design.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/homebody-hollow/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Six tiny cottages made from a boot, a soda cup, a cooking pot, a teacup, a mushroom and a monstera leaf, on the grass by a dirt road, above the words Homebody Hollow: Design your cottage, top to bottom." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <!-- The icon when it's saved to a phone's home screen -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Homebody Hollow" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- The design studio, filled in by game/design.js for the cottage in the
         address (design.html?cottage=teacup). -->
    <main class="picker-shell studio">
      <header class="studio-head">
        <a class="studio-back" href="./village.html">← My village</a>
        <h1 class="design-name"></h1>
        <span class="studio-spacer"></span>
      </header>

      <div class="studio-body">
        <section class="stage" aria-label="Your cottage">
          <div class="stage-cottage"></div>
          <div class="stage-hill"></div>
        </section>

        <section class="tools">
          <!-- Outside, to paint the cottage, or Inside, to see its rooms. -->
          <div class="mode-switch" role="group" aria-label="Design the">
            <button class="mode on" type="button" aria-pressed="true" data-view="outside">Outside</button>
            <button class="mode" type="button" aria-pressed="false" data-view="inside">Inside</button>
          </div>
          <!-- Pick a color and a pattern, in either order, then tap a part of
               the cottage to fill it. Solid takes the pattern off. -->
          <div class="tool-panel">
            <p class="paint-hint">
              <span class="paint-now" aria-hidden="true"></span>
              <span>Pick a color and a pattern, then tap your cottage to paint it.</span>
            </p>
            <div class="palette" role="group" aria-label="Colors"></div>
            <div class="patterns" role="group" aria-label="Patterns"></div>
            <!-- Rocks, trees or flowers around the cottage: one, or none. -->
            <h2 class="yard-title">Yard</h2>
            <div class="yard-options" role="group" aria-label="Yard"></div>
          </div>
          <!-- Inside: the cottage's rooms, empty for now, from the top down. -->
          <div class="inside-panel" hidden>
            <p class="paint-hint"><span>Each room is yours to fill with anything you like.</span></p>
            <h2 class="yard-title rooms-title"></h2>
            <ol class="room-list"></ol>
          </div>
        </section>
      </div>

      <footer class="studio-actions">
        <button class="studio-reset" type="button">Start over</button>
        <!-- Only when changing a cottage you've built: empties its lot. -->
        <button class="studio-reset studio-moveout" type="button" hidden>Move out</button>
        <span class="studio-actions-gap"></span>
        <p class="studio-full" hidden>Your village is full. Move a cottage out to make room.</p>
        <!-- Puts the cottage on its lot ("Done" when changing one). -->
        <button class="start-btn studio-done" type="button">Move in!</button>
      </footer>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/design.js"></script>
  </body>
</html>
