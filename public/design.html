<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homebody Hollow | Design Your Cottage</title>
    <meta name="description" content="Design your tiny cottage in Homebody Hollow: pick a color and a pattern, paint any part of it, then see it in the village." />
    <link rel="canonical" href="https://jessicasogge.github.io/homebody-hollow/design.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homebody Hollow" />
    <meta property="og:title" content="Homebody Hollow | Design Your Cottage" />
    <meta property="og:description" content="Design your tiny cottage in Homebody Hollow: pick a color and a pattern, paint any part of it, then see it in the village." />
    <meta property="og:url" content="https://jessicasogge.github.io/homebody-hollow/design.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/homebody-hollow/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Six tiny cottages made from a boot, a soda cup, a cooking pot, a teacup, a mushroom and a monstera leaf, on the grass by a dirt road, above the words Homebody Hollow: Design your cottage, top to bottom." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <!-- The icon when it's saved to a phone's home screen -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Homebody Hollow" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- The design studio, filled in by game/design.js for the cottage in the
         address (design.html?cottage=teacup). -->
    <main class="picker-shell studio">
      <header class="studio-head">
        <a class="studio-back" href="./pick-a-cottage.html">← Cottages</a>
        <h1 class="design-name"></h1>
        <span class="studio-spacer"></span>
      </header>

      <div class="studio-body">
        <section class="stage" aria-label="Your cottage">
          <div class="stage-cottage"></div>
          <div class="stage-hill"></div>
        </section>

        <section class="tools">
          <!-- Outside now. Inside is where each room's design will go. -->
          <div class="mode-switch" role="group" aria-label="Design the">
            <button class="mode on" type="button" aria-pressed="true">Outside</button>
            <button class="mode" type="button" disabled>Inside <span class="soon">soon</span></button>
          </div>
          <!-- Pick a color, then a pattern if you like, then tap a part of the
               cottage to fill it. -->
          <div class="tool-panel">
            <p class="paint-hint">
              <span class="paint-now" aria-hidden="true"></span>
              <span>Pick a color, then a pattern if you like, then tap your cottage to paint it.</span>
            </p>
            <div class="palette" role="group" aria-label="Colors"></div>
            <div class="patterns" role="group" aria-label="Patterns"></div>
          </div>
        </section>
      </div>

      <footer class="studio-actions">
        <button class="studio-reset" type="button">Start over</button>
        <span class="studio-actions-gap"></span>
        <a class="studio-village" href="./village.html">See it in the village</a>
        <!-- Doesn't do anything yet. -->
        <button class="start-btn studio-done" type="button">Move in!</button>
      </footer>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/design.js"></script>
  </body>
</html>
