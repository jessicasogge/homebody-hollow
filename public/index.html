<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homebody Hollow: A Tiny House Game</title>
    <meta name="description" content="A free cozy game you play in your browser: pick a tiny house made from something else, like a boot or a teacup, and design it your way." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-title" content="Homebody Hollow" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The houses, drawn by script.js, sitting on a shelf -->
    <div class="street"></div>
    <div class="shelf"></div>

    <h1 class="logo">Homebody Hollow</h1>
    <p class="tagline">Design your own tiny home, top to bottom.</p>
    <button class="start-btn" type="button">Press Start to Play</button>
    <p class="about">
      Every house in the Hollow used to be something else. Pick one and make
      it your own.
    </p>
    <p class="sister-game">
      From the maker of
      <a href="https://jessicasogge.github.io/petripals/">PetriPals</a> and
      <a href="https://jessicasogge.github.io/fungals/">FunGals</a>.
    </p>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./script.js"></script>
  </body>
</html>
