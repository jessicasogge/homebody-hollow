<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homebody Hollow | Your Village</title>
    <meta name="description" content="Your village in Homebody Hollow: six lots by a dirt road, each waiting for a cottage you design and a friend to live in it." />
    <link rel="canonical" href="https://jessicasogge.github.io/homebody-hollow/village.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homebody Hollow" />
    <meta property="og:title" content="Homebody Hollow | Your Village" />
    <meta property="og:description" content="Your village in Homebody Hollow: six lots by a dirt road, each waiting for a cottage you design and a friend to live in it." />
    <meta property="og:url" content="https://jessicasogge.github.io/homebody-hollow/village.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/homebody-hollow/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nine tiny cottages made from a boot, a soda cup, a cat, a mushroom, a cooking pot cut open to show its furnished rooms, a teacup, a handbag, a puppy and a monstera leaf, with little animal friends at their doors, on the grass by a dirt road, above the words Homebody Hollow: Design your cottage, top to bottom." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <!-- The icon when it's saved to a phone's home screen -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Homebody Hollow" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- Your six lots, built or for sale, filled in by game/village.js from
         what's saved in this browser. -->
    <main class="picker-shell village">
      <header class="studio-head">
        <a class="studio-back" href="./index.html">← Home</a>
        <h1>Your Village</h1>
        <span class="studio-spacer"></span>
      </header>
      <section class="village-scene" aria-label="Your village">
        <!-- The sun (or, at night, the moon): tap it for night or day. -->
        <button class="sky-toggle" type="button" aria-pressed="false" aria-label="Night"></button>
        <div class="lots"></div>
      </section>
      <p class="swipe-hint">Swipe to see the whole street →</p>
      <p class="village-hint"></p>
      <p class="lot-count"></p>
      <!-- Clear village: asks first, then empties every lot. Only shown when
           there's a cottage to clear. -->
      <div class="clear-village" hidden>
        <button class="clear-start" type="button">Clear village</button>
        <div class="clear-confirm" role="group" aria-label="Clear village?" hidden>
          <p>Remove all your cottages? This can't be undone.</p>
          <button class="clear-yes" type="button">Yes, clear it</button>
          <button class="clear-no" type="button">Keep them</button>
        </div>
      </div>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/village.js"></script>
    <!-- Counts visits on GoatCounter, shared with PetriPals (no cookies,
         nothing personal), and game events (game/track.js). -->
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
